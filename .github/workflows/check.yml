name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate hosts and build Home Manager
        run: nix flake check --show-trace
      - name: Formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check
