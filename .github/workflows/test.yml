
name: NixOS Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NixOS configurations
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /

          # Remove unnecessary preinstalled software.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true

          echo "Disk space after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nix version
        run: nix --version

      - name: Check flake
        run: nix flake check --show-trace

      - name: Show disk before builds
        run: |
          echo "Filesystem:"
          df -h /
          echo "Nix store:"
          df -h /nix

      - name: Build AMD laptop
        run: |
          nix build \
            --show-trace \
            --print-build-logs \
            .#nixosConfigurations.laptop-amd.config.system.build.toplevel

      - name: Show disk after AMD build
        run: |
          df -h /
          nix path-info -Sh \
            .#nixosConfigurations.laptop-amd.config.system.build.toplevel

      - name: Build Intel laptop
        run: |
          nix build \
            --show-trace \
            --print-build-logs \
            .#nixosConfigurations.laptop-intel.config.system.build.toplevel

      - name: Show disk after Intel build
        run: |
          df -h /
          nix path-info -Sh \
            .#nixosConfigurations.laptop-intel.config.system.build.toplevel

      - name: Build summary
        if: always()
        run: |
          echo "## NixOS build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

