name: update

# Updates flake.lock, builds both laptops when the lock changes, and pushes it
# to main. The laptops then pull and switch instead of updating themselves.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update inputs
        id: update
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build both laptops
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --show-trace --print-build-logs
      - name: Commit lock file
        if: steps.update.outputs.changed == 'true'
        run: |
          git add flake.lock
          git commit -m "flake.lock: Update"
      - name: Push
        if: steps.update.outputs.changed == 'true'
        run: git push
